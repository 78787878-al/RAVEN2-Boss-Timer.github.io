body.spawn-glow::before {

  content: "";

  50% {

  100% {

<script>




let globalVolume = 0.7;
console.log("Death table script loaded");

const deathTbody = document.querySelector("#deathTimer tbody");

const deathBosses = [
  { name: "ДВУЛИКИЙ МОРГОН        4.* ", respawnHours: 2, nextSpawn: null, players: "A" },
  { name: "МАРИОНЕТКА НИДРОК      4.* ", respawnHours: 72, nextSpawn: null, players: "C" },
  { name: "ДРЕВНИЙ ДРАКОН ИСТЕРИЯ 4.* ", respawnHours: 72, nextSpawn: null, players: "I" },
  { name: "СИОН. ТЕНЬ ОТЧАЯНИЯ    4.* ", respawnHours: 72, nextSpawn: null, players: "D" },
  { name: "РИГРЕТОЮ ТЕНЬ ЗЛОБЫ    4.* ", respawnHours: 72, nextSpawn: null, players: "C" },
  { name: "ЛУНОС. ПОРЧЕННЫЙ ГЕРОЙ 4.* ", respawnHours: 72, nextSpawn: null, players: "A" },
  { name: "ФЛАУД ТЕМНОЕ ГЛУБ.МОРЕ 5.* ", respawnHours: 72, nextSpawn: null, players: "C" },
  { name: "КОРОЛЬ ЗВЕРЕЙ ГАРДОН   4.* ", respawnHours: 72, nextSpawn: null, players: "I" },
  { name: "ЛЕДИ ЖЕЛАНИЯ БЕЛЛА.    4.* ", respawnHours: 72, nextSpawn: null, players: "D" },
  { name: "КРАТЕРИУС ИСКРИВЛЕННЫЙ.5.* ", respawnHours: 72, nextSpawn: null, players: "C" }
];

const deathTbody3 = document.querySelector("#deathTimer3 tbody");

const deathBosses3 = [
  { name: "ПРИМЕР БОССА 1", respawnHours: 24, nextSpawn: null, players: "A" },
  { name: "ПРИМЕР БОССА 2", respawnHours: 48, nextSpawn: null, players: "B" }
];

let deathAlerted3 = {};

function formatRemainingTime(ms) {
  if (ms <= 0) return "0м";

  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  let result = "";
  if (hours > 0) result += `${hours}ч `;
  if (minutes > 0) result += `${minutes}м `;
  result += `${seconds}с`;

  return result.trim();
}
function renderDeathTable() {
let deathGlow = false;
  const now = new Date();

 deathTbody.innerHTML = "";

  deathBosses.forEach((boss, index) => {
let rowClass = "";

    let statusIcon = "☠";
    let statusClass = "";

    if (boss.nextSpawn) {
      if (boss.nextSpawn <= now) {
        statusIcon = "🔴";
        statusClass = "missed";
      } else {
        statusIcon = "🟢";
        statusClass = "alive";
      }
    }

let spawnText = "—";

if (boss.nextSpawn) {
  const diff = boss.nextSpawn - now;

if (boss.nextSpawn && diff > 0) {
  const minutes = Math.ceil(diff / 60000);

  // 🔔 за 5 минут
  if (minutes === 5 && !deathAlerted[index + "_5"]) {
    if (soundEnabled) {
    sound.currentTime = 0;
    sound.volume = globalVolume;
      sound.play();
    }
    deathAlerted[index + "_5"] = true;
  }

  // 🔔 за 3 минуты
  if (minutes === 2 && !deathAlerted[index + "_2"]) {
    if (soundEnabled) {
      sound.currentTime = 0;
      sound.volume = globalVolume;
      sound.play();
    }
    deathAlerted[index + "_2"] = true;
  }

  // 🔔 за 1 минуту
  if (minutes === 1 && !deathAlerted[index + "_1"]) {
    if (soundEnabled) {
      sound.currentTime = 0;
      sound.volume = globalVolume;
      sound.play();
    }
    deathAlerted[index + "_1"] = true;
  }
}

  if (diff <= 5 * 60 * 1000) {
    deathGlow = true;
    rowClass = "death-row-alert";
  }

  if (boss.nextSpawn <= now) {
    rowClass = "death-row-alert";
  }


  if (diff > 0) {
    spawnText =
      '<div class="spawn-time">' +
       boss.nextSpawn.toLocaleTimeString() +
       '</div>' +
       '<div class="spawn-remaining">' +
       formatRemainingTime(diff) +
       '</div>';

  } else {
    spawnText =
      boss.nextSpawn.toLocaleTimeString() +
      " (готов)";
  }
}

    deathTbody.innerHTML += `
      <tr class="${rowClass}">
        <td class="boss-name">
  <span class="boss-name-text">${boss.name}</span>
</td>

        <td class="boss-cell ${statusClass}" onclick="killDeathBoss(${index})">
          <span>${statusIcon}</span>
        </td>

        <td>${spawnText}</td>
        <td>${boss.players ?? "-"}</td>

         <td>
          <button
            onmousedown="startHold(${index}, 1)"
            onmouseup="stopHold()"
            onmouseleave="stopHold()"
            onclick="adjustDeath(${index}, 60)"
           >+</button>

           <button
            onmousedown="startHold(${index}, -1)"
            onmouseup="stopHold()"
            onmouseleave="stopHold()"
            onclick="adjustDeath(${index}, -60)"
           >−</button>
          </td>
      </tr>
    `;
  });



  document.body.classList.toggle("death-glow", deathGlow);
}
function killDeathBoss(index) {
  const now = new Date();
  const hours = deathBosses[index].respawnHours;

  now.setHours(now.getHours() + hours);
  deathBosses[index].nextSpawn = now;

  renderDeathTable();
  delete alerted[index + "_2"];
  delete alerted[index + "_1"];
  delete deathAlerted[index + "_5"];
  delete deathAlerted[index + "_2"];
  delete deathAlerted[index + "_1"];

}

function adjustDeath(index, minutes) {
  if (!deathBosses[index].nextSpawn) return;

  deathBosses[index].nextSpawn.setMinutes(
    deathBosses[index].nextSpawn.getMinutes() + minutes
  );

  renderDeathTable();
}
let holdInterval = null;

function startHold(index, direction) {
  holdInterval = setInterval(() => {
    adjustDeath(index, direction); // ±1 минута

function getWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

const notesWindow = document.getElementById("notesWindow");
const notesHeader = document.getElementById("notesHeader");
const notesArea = document.getElementById("notesArea");

// === DRAG ===
let offsetX = 0, offsetY = 0, isDragging = false;

notesHeader.addEventListener("mousedown", (e) => {
  isDragging = true;
  offsetX = e.clientX - notesWindow.offsetLeft;
  offsetY = e.clientY - notesWindow.offsetTop;
});

document.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  notesWindow.style.left = (e.clientX - offsetX) + "px";
  notesWindow.style.top  = (e.clientY - offsetY) + "px";
});

document.addEventListener("mouseup", () => {
  isDragging = false;
});
const resizeHandle = document.getElementById("notesResize");

let resizing = false;
let startX, startY, startW, startH;

resizeHandle.addEventListener("mousedown", (e) => {
  e.preventDefault();
  resizing = true;

  startX = e.clientX;
  startY = e.clientY;
  startW = notesWindow.offsetWidth;
  startH = notesWindow.offsetHeight;
});

document.addEventListener("mousemove", (e) => {
  if (!resizing) return;

  const newW = startW + (e.clientX - startX);
  const newH = startH + (e.clientY - startY);

  notesWindow.style.width  = Math.max(180, newW) + "px";
  notesWindow.style.height = Math.max(140, newH) + "px";
});

document.addEventListener("mouseup", () => {
  if (!resizing) return;
  resizing = false;

  // сохраняем размер
  localStorage.setItem("notesWidth", notesWindow.offsetWidth);
  localStorage.setItem("notesHeight", notesWindow.offsetHeight);
});

// восстановление размера
const savedW = localStorage.getItem("notesWidth");
const savedH = localStorage.getItem("notesHeight");

if (savedW && savedH) {
  notesWindow.style.width  = savedW + "px";
  notesWindow.style.height = savedH + "px";
}
